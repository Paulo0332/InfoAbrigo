# Publicação da API no Render, pelo Dockerfile. MYSQL_* são preenchidos no painel,
# com os dados de um MySQL hospedado; nunca devem entrar no repositório.
services:
  - type: web
    name: infoabrigo-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /saude
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        value: infoabrigo
      - key: JWT_SEGREDO
        generateValue: true
