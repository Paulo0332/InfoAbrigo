# Abre o InfoAbrigo pelo Expo Go, do zero. Os outros fluxos chamam este.
# O endereço é o que o "npx expo start" mostra no terminal.
appId: host.exp.exponent
---
- clearState
- launchApp
- openLink: ${EXPO_URL}

# Na primeira vez depois de limpar o cache do Expo, montar o app ("Bundling")
# pode levar alguns minutos.
- extendedWaitUntil:
    visible: "Bundling.*"
    timeout: 15000
    optional: true
- extendedWaitUntil:
    notVisible: "Bundling.*"
    timeout: 300000
    optional: true

# Depois do clearState, o Expo Go mostra o menu de desenvolvedor por cima do app.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Toggle element inspector"
    commands:
      - back

- extendedWaitUntil:
    visible: "Os abrigos da sua região, e o que eles precisam hoje."
    timeout: 30000
